<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII 艺术生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; color: #333; }
        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input { width: 100%; }
        select { width: 200px; }
        textarea { width: 100%; min-height: 150px; font-family: monospace; resize: vertical; }
        .btn { padding: 8px 20px; border-radius: 4px; cursor: pointer; border: none; font-size: 14px; margin-right: 8px; }
        .btn-blue { background: #007bff; color: #fff; }
        .btn-green { background: #28a745; color: #fff; }
        .btn-gray { background: #6c757d; color: #fff; }
        .output { background: #1e1e1e; color: #00ff00; padding: 20px; border-radius: 8px; font-family: monospace; font-size: 12px; line-height: 1.2; white-space: pre; overflow-x: auto; min-height: 200px; }
        .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .preset-btn { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
        .preset-btn:hover { background: #e9ecef; }
        .preset-btn.active { background: #007bff; color: #fff; border-color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ASCII 艺术生成器</h1>
        <div class="card">
            <div class="form-group">
                <label>输入文字</label>
                <input type="text" id="text" placeholder="输入要生成 ASCII 艺术的文字" value="HELLO">
            </div>
            <div class="form-group">
                <label>选择字体</label>
                <select id="font">
                    <option value="block">Block</option>
                    <option value="banner">Banner</option>
                    <option value="standard">Standard</option>
                    <option value="small">Small</option>
                </select>
            </div>
            <button class="btn btn-blue" onclick="generate()">生成 ASCII</button>
            <button class="btn btn-green" onclick="copyOutput()">复制</button>
            <button class="btn btn-gray" onclick="clearOutput()">清空</button>
        </div>
        <div class="card">
            <div class="output" id="output"></div>
        </div>
        <div class="card">
            <label>预设图案</label>
            <div class="presets" id="presets">
                <button class="preset-btn" onclick="showPreset('cat')">🐱 猫</button>
                <button class="preset-btn" onclick="showPreset('dog')">🐶 狗</button>
                <button class="preset-btn" onclick="showPreset('heart')">❤️ 心形</button>
                <button class="preset-btn" onclick="showPreset('star')">⭐ 星星</button>
                <button class="preset-btn" onclick="showPreset('skull')">💀 骷髅</button>
                <button class="preset-btn" onclick="showPreset('robot')">🤖 机器人</button>
            </div>
        </div>
    </div>
    <script>
        const fonts = {

                'F': ['███████', '██     ', '█████  ', '██     ', '██     '],
                'G': [' ██████', '██     ', '██  ███', '██   ██', ' ██████'],
                'H': ['██   ██', '██   ██', '███████', '██   ██', '██   ██'],

                'U': ['██   ██', '██   ██', '██   ██', '██   ██', ' ██████'],
                'V': ['██   ██', '██   ██', '██   ██', ' ██ ██ ', '  ███  '],

                '0': [' ██████', '██  ███', '██ █ ██', '████  ██', ' ██████'],
                '1': ['  ██   ', ' ███   ', '  ██   ', '  ██   ', '███████'],
                '2': ['██████ ', '    ██ ', ' █████ ', '████   ', '███████'],
                '3': ['██████ ', '    ██ ', ' █████ ', '    ██ ', '██████ '],
                '4': ['██   ██', '██   ██', '███████', '    ██ ', '    ██ '],
                '5': ['███████', '██     ', '██████ ', '    ██ ', '██████ '],
                '6': [' ██████', '██     ', '██████ ', '██   ██', ' ██████'],
                '7': ['███████', '    ██ ', '   ███ ', '   ███ ', '   ███ '],

                '9': [' ██████', '██   ██', ' ██████', '    ██ ', '██████ ']
            },
            banner: {

                'B': ['#### ', '#   #', '#### ', '#   #', '#### '],
                'C': [' ####', '#    ', '#    ', '#    ', ' ####'],
                'E': ['#####', '#    ', '###  ', '#    ', '#####'],
                'H': ['#   #', '#   #', '#####', '#   #', '#   #'],

            },

                'C': [' ____', '/   |', '|___ '],
                'D': ['|  |', '|  |', '|__|'],

                'G': [' ____', '/ __|', '\\__ \\'],
                'H': ['|  |', '|__|', '|  |'],
                'I': [' ___', '  |', '  |'],
                'J': ['   |', '   |', '___|'],
                'K': ['|  /', '|<  ', '|  \\'],
                'L': ['|   ', '|   ', '|___'],
                'M': ['/\\ |', '|  \\|', '|   |'],

            },
            small: {
                'A': [' . ', '/o\\', '|_|'],
                'B': [' _ ', '(_]', '(_)'],
                'C': [' _ ', '/ ', '|_ '],
                'D': [' _ ', '| \\', '|_/'],
                'E': [' _ ', '|_ ', '|_ '],
                'F': [' _ ', '|_ ', '|  '],

                'H': ['   ', '|_|', '| |'],

                'K': ['   ', '|\\ ', '| \\'],
                'L': ['   ', '|  ', '|_ '],
                'M': ['   ', '|\\|', '| |'],
                'N': ['   ', '|\\|', '| |'],
                'O': [' _ ', '| |', '|_|'],
                'P': [' _ ', '|_]', '|  '],
                'Q': [' _ ', '| |', '|_\\'],
                'R': [' _ ', '|_]', '| \\'],
                'S': [' _ ', '/  ', ' _\\'],
                'T': [' _ ', ' | ', ' | '],
                'U': ['   ', '| |', '|_|'],
                'V': ['   ', '\\ /', ' V '],
                'W': ['   ', '| |', '| |'],
                'X': ['   ', ')\\(', '(_/'],
                'Y': ['   ', ')\\|', ' | '],
                'Z': [' _ ', '  /', ' /_']
            }
        };
        
        const presets = {
            cat: `
  /\\_____/\\
 /  o   o  \\
( ==  ^  == )
 \\_____/
  /|   |\\
 (_|   |_)
`,
            dog: `
    / \\__
   (    @\\___
   /         O
  /   (_____/
 /_____/   U
`,
            heart: `
  ♥♥   ♥♥
 ♥♥♥♥ ♥♥♥♥
♥♥♥♥♥♥♥♥♥♥♥
 ♥♥♥♥♥♥♥♥♥
  ♥♥♥♥♥♥
   ♥♥♥♥
    ♥♥
     ♥
`,
            star: `
    *
   /|\\
  / | \\
 /  |  \\
 *---+---*
  \\  |  /
   \\ | /
    \\|/
     *
`,
            skull: `
  .----.
 /      \\
|  O  O  |
|    __  |
 \\  \\__/ /
  '----'
`,
            robot: `
  _____
 |     |
 |O   O|
 |  ^  |
 | \_/ |
 |_____|
`
        };
        
        function generate() {
            const text = document.getElementById('text').value.toUpperCase();
            const font = document.getElementById('font').value;
            const output = document.getElementById('output');
            
            const fontData = fonts[font] || fonts.block;
            const lines = ['', '', '', '', ''];
            
            for (const char of text) {
                const charData = fontData[char] || ['   ', '   ', '   ', '   ', '   '];
                for (let i = 0; i < 5; i++) {
                    lines[i] += (charData[i] || '   ') + ' ';
                }
            }
            
            output.textContent = lines.map(l => l.trimEnd()).join('\n');
        }
        
        function showPreset(name) {
            document.getElementById('output').textContent = presets[name];
        }
        
        function copyOutput() {
            const text = document.getElementById('output').textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                btn.textContent = '已复制!';
                setTimeout(() => btn.textContent = '复制', 1500);
            });
        }
        
        function clearOutput() {
            document.getElementById('output').textContent = '';
        }
        
        generate();
    </script>
</body>
</html>
